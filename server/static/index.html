<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台灣麻將教室</title>
<script>
// Apply before the stylesheet is loaded, including on a direct table URL.
(() => {
  let theme = 'A';
  try {
    const saved = localStorage.getItem('mj-table-theme');
    if (['A', 'B', 'C', 'D'].includes(saved)) theme = saved;
  } catch (_) {}
  document.documentElement.dataset.tableTheme = theme;
})();
</script>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🀄</text></svg>">
</head>
<body>
<a class="skip-link" href="#app">跳到主要內容</a>
<main id="app" class="app"></main>
<div id="rotate-prompt" class="rotate-prompt" role="dialog" aria-modal="true" aria-label="請把手機轉橫" tabindex="-1" hidden>
  <svg aria-hidden="true" viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="currentColor" stroke-width="3">
    <rect x="22" y="14" width="24" height="38" rx="4" transform="rotate(-30 34 33)"/>
    <path d="M12 26a23 23 0 0 1 39-13M43 12l9 1-1-9M52 38a23 23 0 0 1-39 13M21 52l-9-1 1 9"/>
  </svg>
  <p>請把手機轉橫</p>
</div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
