<!doctype html>
<html lang="zh-Hant" data-table-theme="A">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAMPLE · 台灣麻將教室</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <style>
    /* Study-only styles. All pigments come from the live table tokens.
       #1/A … #3/D select the study; ?mock=1 hides the study toolbar for capture. */
    .lobby-study { margin: 0; background: var(--page); color: var(--ink); }
    .lobby-study button, .lobby-study select, .lobby-study a { -webkit-tap-highlight-color: transparent; }
    .lobby-study button, .lobby-study select { font: inherit; }
    .lobby-study a { color: inherit; text-decoration: none; }
    .study-controls { max-width: 1180px; margin: 20px auto; padding: 0 12px; display: flex; align-items: center; gap: 16px; }
    .study-controls > strong { font-size: 11px; letter-spacing: .18em; }
    .study-controls label { display: flex; align-items: center; gap: 8px; }
    .lobby-study select { min-height: 44px; padding: 0 30px 0 12px; border: 1px solid var(--wood); border-radius: 10px; background: var(--panel); color: var(--ink); }
    .study-shell { width: calc(100% - 48px); max-width: 1180px; min-height: calc(100vh - 48px); margin: 24px auto; border: 8px solid var(--wood-hi); border-radius: 28px; overflow: clip; background: var(--page); box-shadow: 0 12px 32px color-mix(in srgb, var(--ink) 8%, transparent); }
    .study-header { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 15px 24px 20px; background: var(--wood-hi); color: var(--wood-ink); }
    .study-brand { display: flex; align-items: center; gap: 12px; }
    .study-brand h1 { font-size: 21px; letter-spacing: .04em; margin: 0; }
    .study-mark { display: grid; place-items: center; width: 34px; height: 38px; border-radius: 9px; color: var(--ink); background: var(--panel); font: 700 24px var(--serif); box-shadow: 0 2px 0 var(--wood); }
    .study-theme { display: flex; align-items: center; gap: 10px; font-size: 13px; white-space: nowrap; }
    .study-main { max-width: 1100px; margin: auto; padding: 38px 30px 44px; }
    .study-heading { display: flex; align-items: baseline; gap: 20px; margin-bottom: 28px; }
    .study-heading h2 { margin: 0; font-size: clamp(25px, 3vw, 32px); line-height: 1.4; letter-spacing: .03em; }
    .study-heading::after { content: ''; flex: 1; height: 1px; background: var(--wood-hi); }
    .study-card, .study-tool, .study-row { position: relative; border: 1px solid var(--wood-hi); background: var(--lacquer); transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease; }
    .study-card { display: flex; flex-direction: column; min-width: 0; border-radius: 20px; overflow: hidden; box-shadow: 0 3px 0 color-mix(in srgb, var(--wood) 25%, transparent), 0 8px 20px color-mix(in srgb, var(--ink) 4%, transparent); }
    .study-card-copy { display: flex; flex-direction: column; align-items: flex-start; padding: 20px 22px 22px; gap: 8px; flex: 1; }
    .study-name { display: flex; width: 100%; align-items: center; justify-content: space-between; font-size: 23px; line-height: 1.4; font-weight: 700; letter-spacing: .04em; }
    .study-desc { display: block; font-size: 14px; line-height: 1.7; color: var(--ink-dim); }
    .study-progress { display: inline-flex; align-items: center; gap: 6px; margin-top: 5px; padding: 4px 9px; border: 1px solid var(--wood-hi); border-radius: 7px; font-size: 12px; line-height: 1.5; color: var(--ink-faint); background: var(--panel); white-space: nowrap; }
    .study-progress::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
    .study-chevron { flex: 0 0 auto; width: 20px; height: 20px; color: var(--ink-dim); }
    .study-art { display: grid; place-items: center; height: 126px; margin: 10px 10px 0; border-radius: 12px; background: var(--felt-2); overflow: hidden; }
    .study-art svg { display: block; height: 100%; width: 100%; max-width: 270px; }
    .study-game-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .study-tools { display: grid; gap: 14px; }
    .study-tool { display: flex; align-items: center; gap: 14px; padding: 22px; border-radius: 16px; min-height: 94px; }
    .study-tool-copy { flex: 1; min-width: 0; }
    .study-tool strong { display: block; margin-bottom: 5px; font-size: 17px; }
    .study-tool .study-desc { font-size: 13px; }
    .study-icon { display: grid; place-items: center; flex: 0 0 46px; width: 46px; height: 46px; color: var(--ink); background: var(--felt-2); border-radius: 13px; }
    .study-icon svg { width: 25px; height: 25px; }
    .study-hero { display: grid; grid-template-columns: 1.1fr 1fr; align-items: center; gap: 24px; margin-bottom: 22px; padding: 32px 38px; border: 1px solid var(--wood); border-radius: 22px; background: var(--felt-2); box-shadow: 0 5px 0 color-mix(in srgb, var(--wood) 25%, transparent); }
    .study-hero h3 { margin: 0 0 12px; font-size: 36px; letter-spacing: .06em; line-height: 1.3; }
    .study-hero .study-desc { font-size: 16px; }
    .study-hero .study-art { height: 220px; margin: 0; background: transparent; }
    .study-hero .study-art svg { max-width: 370px; }
    .study-hero-action { display: flex; align-items: center; gap: 18px; margin-top: 22px; }
    .study-start { display: inline-flex; justify-content: center; align-items: center; gap: 28px; min-height: 48px; padding: 10px 22px; border-radius: 10px; background: var(--ink); color: var(--page) !important; font-weight: 700; transition: transform 160ms ease, box-shadow 160ms ease; }
    .study-start .study-chevron { color: inherit; }
    .study-hero .study-progress { margin: 0; }
    .study-small-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .study-small-grid .study-card { flex-direction: row; padding: 22px 18px; gap: 18px; }
    .study-small-grid .study-card-copy { padding: 0; }
    .study-small-grid .study-name { font-size: 21px; }
    .study-small-grid .study-desc { min-height: 0; }
    .study-quiet-tools { display: flex; justify-content: center; gap: 32px; margin-top: 28px; }
    .study-quiet-tools .study-tool { padding: 10px 0; min-height: 44px; border: 0; background: transparent; border-radius: 8px; gap: 10px; }
    .study-quiet-tools .study-icon { width: 30px; height: 30px; flex-basis: 30px; background: transparent; }
    .study-quiet-tools .study-icon svg { width: 22px; height: 22px; }
    .study-quiet-tools strong { font-size: 14px; margin: 0; }
    .study-quiet-tools .study-desc, .study-quiet-tools .study-chevron { display: none; }
    .study-list-wrap { max-width: 860px; margin: 0 auto; }
    .study-group-title { margin: 24px 0 10px 4px; color: var(--ink-dim); font-size: 13px; font-weight: 600; letter-spacing: .14em; }
    .study-group-title:first-child { margin-top: 0; }
    .study-list { border: 1px solid var(--wood-hi); border-radius: 18px; overflow: hidden; background: var(--lacquer); box-shadow: 0 4px 16px color-mix(in srgb, var(--ink) 3%, transparent); }
    .study-row { display: flex; align-items: center; gap: 20px; min-height: 98px; padding: 20px 24px; border: 0; }
    .study-row + .study-row::before { content: ''; position: absolute; top: 0; left: 90px; right: 24px; height: 1px; background: var(--wood-hi); }
    .study-row .study-icon { background: transparent; border: 1px solid var(--wood-hi); }
    .study-row-copy { flex: 1; min-width: 0; }
    .study-row .study-name { margin-bottom: 4px; font-size: 18px; }
    .study-row .study-progress { margin: 0 4px 0 0; background: var(--panel); }
    .lobby-study [hidden] { display: none; }
    .lobby-study :is(a, button, select):focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; z-index: 1; }
    .lobby-study .study-row:focus-visible { outline-offset: -4px; }
    .lobby-study :is(a, button):active { transform: translateY(1px) scale(.99); }
    @media (hover: hover) {
      .lobby-study :is(.study-card, .study-tool):hover { transform: translateY(-3px); border-color: var(--ink-dim); box-shadow: 0 8px 22px color-mix(in srgb, var(--ink) 10%, transparent); }
      .lobby-study .study-row:hover { background: var(--panel); }
      .lobby-study .study-start:hover { box-shadow: 0 0 0 4px color-mix(in srgb, var(--ink) 15%, transparent); }
    }
    @media (max-width: 1000px) and (min-width: 701px) {
      .study-game-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .study-small-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      .study-controls { flex-wrap: wrap; margin: 12px; gap: 10px; }
      .study-controls label { flex: 1; }
      .study-controls select { width: 100%; }
      .study-shell { width: calc(100% - 20px); margin: 10px; min-height: calc(100svh - 20px); border-width: 5px; border-radius: 20px; }
      .study-header { flex-wrap: wrap; padding: 12px 12px 16px; gap: 16px; }
      .study-brand { gap: 9px; }
      .study-brand h1 { font-size: 19px; }
      .study-theme { justify-content: space-between; width: 100%; }
      .study-theme select { flex: 1; max-width: 160px; }
      .study-main { padding: 26px 16px 30px; }
      .study-heading { margin-bottom: 22px; gap: 12px; }
      .study-game-grid { grid-template-columns: 1fr; gap: 18px; }
      .study-art { height: 110px; }
      .study-card-copy { padding: 16px 20px 19px; gap: 6px; }
      .study-name { font-size: 23px; }
      .study-tools { gap: 12px; }
      .study-tool { padding: 18px; }
      .study-hero { grid-template-columns: 1fr; gap: 12px; padding: 24px; }
      .study-hero h3 { font-size: 32px; }
      .study-hero .study-desc { font-size: 14px; }
      .study-hero .study-art { grid-row: 1; height: 145px; }
      .study-hero-action { justify-content: space-between; gap: 12px; margin-top: 18px; }
      .study-start { padding-inline: 18px; gap: 16px; }
      .study-small-grid { grid-template-columns: 1fr; gap: 12px; }
      .study-small-grid .study-card { flex-direction: row; padding: 20px; gap: 16px; }
      .study-small-grid .study-name { font-size: 20px; }
      .study-small-grid .study-desc { min-height: 0; }
      .study-small-grid .study-icon { width: 38px; height: 42px; flex-basis: 38px; }
      .study-quiet-tools { margin-top: 20px; gap: 24px; }
      .study-row { display: grid; grid-template-columns: 36px minmax(0, 1fr) 14px; gap: 6px 12px; padding: 18px 14px; }
      .study-row .study-icon { width: 36px; height: 40px; grid-row: 1 / 3; align-self: start; border: 0; }
      .study-row .study-icon svg { width: 26px; height: 26px; }
      .study-row-copy { grid-column: 2; }
      .study-row .study-desc { font-size: 13px; line-height: 1.65; }
      .study-row .study-progress { grid-column: 2; justify-self: start; padding: 2px 7px; font-size: 11px; }
      .study-row > .study-chevron { grid-column: 3; grid-row: 1 / 3; width: 14px; }
      .study-row + .study-row::before { left: 62px; right: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lobby-study *, .lobby-study *::before, .lobby-study *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body class="lobby-study">
  <aside class="study-controls" aria-label="SAMPLE">
    <strong>SAMPLE</strong>
    <label><select id="study-direction" aria-label="SAMPLE">
      <option value="1">1 · 遊戲卡片風</option>
      <option value="2">2 · 主推＋小卡</option>
      <option value="3">3 · 簡潔清單</option>
    </select></label>
  </aside>
  <div class="study-shell">
    <header class="study-header">
      <div class="study-brand"><span class="study-mark" aria-hidden="true">中</span><h1>台灣麻將教室</h1></div>
      <label class="study-theme">牌桌風格<select id="study-theme">
        <option value="A">瓷白</option><option value="B">茶室</option><option value="C">夜藍</option><option value="D">聯名風</option>
      </select></label>
    </header>
    <main class="study-main">
      <div class="study-heading"><h2>今天練哪一種？</h2></div>
      <div id="study-content"></div>
    </main>
  </div>
  <script type="module" src="./js/lobby-samples.js"></script>
</body>
</html>
