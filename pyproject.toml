[project]
name = "taimahjong"
version = "0.1.0"
description = "A heuristic-EV trainer for Taiwanese 16-tile Mahjong"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-timeout==2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exhaustive oracle sweeps and large simulations; excluded from the default run",
]
