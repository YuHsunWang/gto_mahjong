name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Full suite, including the exhaustive oracle sweeps, every night at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  fast:
    name: fast suite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: pytest -m "not slow"
        run: python -m pytest -q -m "not slow" --durations=10

  slow:
    name: exhaustive oracle suite
    # Measured 2026-08-24: 25 minutes, against a 45-minute cap. The oracle
    # sweeps are ~7 of that; endgame exploitability and the equilibrium game
    # are another ~12. Nightly and on demand, never on a push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: pytest -m slow
        run: python -m pytest -q -m slow --durations=10
